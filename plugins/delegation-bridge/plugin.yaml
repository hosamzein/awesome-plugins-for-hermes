name: delegation-bridge
kind: tool-plugin
version: "1.0.0"
description: "Review-First cross-agent delegation bridge for Hermes Agent (Cursor, Codex, Antigravity, OpenCode, Kimi)"
entry_point: __init__.py
provides_tools:
  - name: delegate_task
    description: "Dispatch self-contained task brief to implementer CLI (cursor, codex, antigravity, opencode, kimi)"
  - name: review_task
    description: "Inspect output and git diff generated by delegated agent"
  - name: land_task
    description: "Approve and commit code changes made by implementer"
  - name: reject_task
    description: "Discard uncommitted modifications and restore working tree cleanly"
  - name: list_supported_implementers
    description: "List all supported implementer agents"
